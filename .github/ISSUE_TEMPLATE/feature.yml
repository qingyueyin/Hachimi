name: 功能建议
description: 提出改动或新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目不接受用于传播、售卖下载内容，或绕过平台风控 / 版权保护的功能。
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已阅读使用前须知
          required: true
        - label: 这个建议不是为了批量搬运或商业分发音乐
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么做
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代
      description: 现在有没有凑合能用的办法。
